<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>遥控器适配 · 交互预览</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#34332e;background:#f4f1e9;font-size:15px}*{box-sizing:border-box}body{margin:0}button,select,input{font:inherit;color:inherit}button,select,input{border:1px solid #ded8cd;border-radius:10px;background:#fffdf8;padding:10px 14px}button{cursor:pointer}button:hover:not(:disabled){border-color:#ac5c3f;background:#f7eee7}button:disabled{opacity:.45;cursor:default}button.primary{background:#ae593c;color:white;border-color:#ae593c}button.primary:hover:not(:disabled){background:#91472f}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #ce8968;outline-offset:3px}header,.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header{justify-content:space-between;max-width:1040px;margin:auto;padding:26px 24px}.brand{font-size:21px;font-weight:650}.mark{display:inline-grid;place-items:center;width:34px;height:38px;background:#ae593c;color:#fff;border-radius:11px;margin-right:10px}small,.muted{color:#82796d;font-size:13px}.preview{background:#ebe4d8;border-radius:8px;padding:7px 10px}main{max-width:940px;margin:12px auto 40px;padding:0 24px}.panel{background:#fffdf8;border:1px solid #e4ddd1;border-radius:20px;padding:28px;margin-top:18px;box-shadow:0 8px 30px #55432b06}h1{font-size:25px;margin:0 0 8px}h2{font-size:19px;margin:0}p{line-height:1.65}nav{display:flex;gap:8px;margin:24px 0;flex-wrap:wrap}.step{padding:9px 14px;border-radius:9px;color:#92897b}.step.active{background:#eee0d5;color:#924b31;font-weight:600}.step.done{color:#658065}.between{justify-content:space-between}.device{display:flex;align-items:center;gap:16px;padding:18px 0;border-bottom:1px solid #ece6dc}.device:last-child{border-bottom:0}.device .info{flex:1}.device strong{display:block;margin-bottom:5px}.icon{width:42px;height:52px;border-radius:16px;background:#ede8de;display:grid;place-items:center;font-size:25px}.list{min-height:190px}.spinner{display:inline-block;width:15px;height:15px;border:2px solid #ded6c9;border-top-color:#ae593c;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.status{display:flex;align-items:center;gap:9px;min-height:28px;color:#82796d}.footer{display:flex;justify-content:space-between;gap:12px;margin-top:24px;flex-wrap:wrap}.alert{padding:16px;background:#faede7;border-radius:10px;line-height:1.7;margin:18px 0;color:#88462f}.good{padding:16px;background:#edf1e9;border-radius:10px;line-height:1.7;margin:18px 0;color:#51674b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{display:grid;gap:8px;margin:18px 0}.progress{list-style:none;padding:0;margin:20px 0}.progress li{padding:12px 0;border-bottom:1px solid #ece6dc}.keys{display:flex;flex-wrap:wrap;gap:9px;margin:18px 0}.keys button{min-width:84px}.keys .chosen{outline:2px solid #ae593c}.keys .learned{background:#edf1e9}.remote{background:#eeebe4;padding:22px;border-radius:20px;max-width:240px;margin:18px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.remote button{padding:13px 4px}.remote button:nth-child(1),.remote button:nth-child(5){grid-column:2}.remote button:nth-child(2){grid-column:1}.remote button:last-child{grid-column:1/4}.scenario{font-size:13px}.hint{background:#f4f0e8;border-radius:10px;padding:12px 16px;font-size:13px;line-height:1.7}details{margin:18px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}#content{min-height:330px}a{color:#a45034}@media(max-width:600px){header{padding:18px}main{padding:0 14px}.panel{padding:20px}.grid{grid-template-columns:1fr}.device{gap:10px}.step{padding:7px 9px}.brand{font-size:18px}}@media(prefers-reduced-motion:reduce){.spinner{animation:none}}

.editor{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:28px;margin-top:24px}.canvas{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;background:#eee9df;padding:14px;border:1px solid #ded6c8;border-radius:24px;max-width:440px;margin:16px auto}.cell{height:57px;border:1px dashed #d6cebf;border-radius:9px;min-width:0;position:relative}.cell.empty{cursor:crosshair;background:#f6f2e9}.cell.over{background:#e5c6b3;border-color:#ae593c}.tile{width:100%;height:100%;font-size:13px;padding:4px;background:#fffdf8;cursor:grab;overflow:hidden;word-break:break-word}.tile.verified{background:#e8efdf;border-color:#a8b794}.tick{position:absolute;right:3px;top:1px;color:#637c4f;font-size:11px}.palette{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:12px 0 20px}.palette button{font-size:13px;padding:10px 4px;cursor:grab}.palette button:disabled{cursor:default}.editor aside{max-height:570px;overflow:auto;padding-right:10px;scrollbar-width:thin}.editor aside h3{font-size:14px;margin:18px 0 0}.namefields{display:grid;grid-template-columns:1fr 1fr;gap:18px}.editor .status{font-size:13px}.trash{border:1px dashed #c8b5a6;padding:13px;text-align:center;border-radius:10px;color:#887363;margin-top:18px}.trash.over{background:#fae5db}.modal{border:1px solid #e2d8ca;border-radius:20px;padding:26px;background:#fffdf8;color:#34332e;width:min(440px,calc(100vw - 32px));box-shadow:0 25px 100px #31231930}.modal::backdrop{background:#38312666}.modal input{width:100%}.modal .footer{justify-content:flex-end}.capturebox{text-align:center;padding:20px 8px}.capturebox strong{display:block;font-size:24px;margin:14px}.codes{font:13px monospace;color:#776c5c}.count{font-size:13px;color:#6c765b}.custom-active{outline:2px solid #ae593c}.notice{min-height:23px;font-size:13px;color:#a25337}.sim{border-top:1px solid #e5ded3;padding-top:16px;margin-top:20px}.sim .row{margin-top:12px}.sim button{font-size:13px}.formerror{color:#a24f33;font-size:13px}.tile:active{cursor:grabbing}@media(max-width:650px){.editor{grid-template-columns:1fr}.editor aside{max-height:none;overflow:visible;border-top:1px solid #e6dfd3;padding-top:12px}.namefields{grid-template-columns:1fr;gap:0}.palette{grid-template-columns:repeat(4,minmax(0,1fr))}.canvas{width:100%}.cell{height:52px}}
[hidden]{display:none!important}.layout-tip{background:#eee4d6;border-radius:12px;padding:14px 16px;margin-top:16px;display:grid;gap:6px}.layout-tip strong{font-size:15px;color:#875238}.layout-tip span{font-size:13px;color:#786c5a}
.voice-panel{background:#f4efe5;border-radius:12px;padding:16px}.voice-panel p{font-size:13px}.voice-panel .field{font-size:13px;margin:14px 0}.voice-bars{display:flex;height:56px;align-items:center;justify-content:center;gap:5px;margin-top:10px}.voice-bars i{width:5px;height:5px;background:#b57756;border-radius:3px}.voice-bars.recording i{animation:levels .6s ease-in-out infinite alternate;animation-delay:var(--delay)}@keyframes levels{to{height:var(--h)}}.modal{max-height:calc(100vh - 32px);overflow:auto}@media(prefers-reduced-motion:reduce){.voice-bars.recording i{animation:none;height:var(--h)}}
</style>
<header><div class="brand"><span class="mark">◉</span>Vibe Remote Buddy</div><span class="preview">交互预览 · 不连接设备</span></header>
<main><div class="row between"><div><h1>适配新遥控器</h1><small>为使用现有协议的新型号创建配置</small></div><label class="scenario">模拟场景 <select id="scenario"><option value="xiaomi">小米 · 正常</option><option value="unicom">联通 · 正常</option><option value="disconnect">连接中断 · SDK 7</option><option value="mismatch">协议不匹配</option></select></label></div><section class="panel"><nav id="steps"></nav><div id="content"></div></section><p class="muted">此页面的数据、连接和按键均为模拟。不会扫描蓝牙、修改绑定或刷写固件。</p></main>
<dialog id="modal" class="modal" aria-labelledby="modalTitle"></dialog>
<script>
const $=s=>document.querySelector(s), names=['发现设备','连接与识别','按键与布局','保存型号'];
let step=0,scenario='xiaomi',selected=null,protocol='auto',phase=0,error=false,completed=false,retried=false,token=0,chosen='上',mapped={},actions={},modelName='',modelId='my.remote.v1',filter=true;
const keys=['上','下','左','右','确认','返回','主页','菜单','语音'];
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const protocolLabel=()=>protocol==='auto'?'自动识别':protocol==='xiaomi'?'小米 · ATVV':'联通 · HID/ICO';
function reset(){token++;step=0;selected=null;phase=0;error=false;completed=false;retried=false;mapped={};actions={};placed=[];nextKey=1;modelName='';modelId='my.remote.v1';render()}
$('#scenario').onchange=e=>{scenario=e.target.value;reset()};
function go(n){step=n;render()}
function render(){ $('#steps').innerHTML=names.map((x,i)=>`<span class="step ${i===step?'active':i<step?'done':''}">${i<step?'✓':i+1} ${x}</span>`).join('');
if(step===0){$('#content').innerHTML=`<div class="row between"><h2>附近的设备</h2><span class="status"><i class="spinner"></i>正在搜索</span></div><p class="muted">将遥控器置于配对模式，并放在接收器旁。</p><div class="list">${[{name:scenario==='unicom'?'联通遥控器':'小米遥控器（待确认型号）',rssi:-43},{name:'遥控器',rssi:-57}].map((d,i)=>`<div class="device"><div class="icon">⌁</div><div class="info"><strong>${d.name}</strong><small>${d.rssi} dBm · ${i?'B2:41:08:93:20:17':'A1:32:76:90:12:04'}</small></div><button onclick="selectDevice(${i})">选择</button></div>`).join('')}</div>`;return}
if(step===1){const mismatch=completed&&(scenario==='mismatch'||(protocol!=='auto'&&protocol!==(scenario==='unicom'?'unicom':'xiaomi')));$('#content').innerHTML=`<h2>${escape(selected)}</h2><label class="field">待适配协议<select id="protocol" ${phase&&!completed&&!error?'disabled':''}><option value="auto">自动识别</option><option value="xiaomi">小米 · ATVV</option><option value="unicom">联通 · HID/ICO</option></select></label><p class="muted">选择已有协议作为适配基础；设备是否兼容由读取结果确认。</p>${phase?`<ul class="progress">${['建立蓝牙连接','配对并加密','读取服务与设备信息','核对协议特征'].map((x,i)=>`<li>${error&&i===phase-1?'!':i<phase-1||completed?'✓':i===phase-1?'<i class="spinner"></i>':'○'}　${x}</li>`).join('')}</ul>`:''}${error?`<div class="alert"><strong>读取设备信息时连接已断开</strong><br>SDK 7 · BLE_HS_ENOTCONN<br>这不代表协议不兼容。重新进入配对模式后可重试。<details><summary>诊断详情（模拟）</summary><pre>步骤：读取服务\nSDK：7 / 0x07\n断开原因：连接监督超时（模拟）</pre></details></div>`:completed?mismatch?`<div class="alert">未找到所选协议的完整特征。暂不能按这个协议创建型号。可以更换协议重新检测，或保存诊断。</div>`:`<div class="good">已发现 ${scenario==='unicom'?'联通 HID/ICO':'小米 ATVV'} 特征</div><p class="muted">按键可以继续采集；语音兼容性需要安装型号后实际验证。</p>`:''}<div class="footer"><button onclick="reset()">返回</button><div class="row">${error||completed?'<button onclick="diagnostic()">保存诊断</button>':''}${completed&&!mismatch?'<button class="primary" onclick="go(2)">配置按键</button>':`<button class="primary" ${phase&&!completed&&!error?'disabled':''} onclick="connect()">${error?'重试':completed?'重新检测':'连接并识别'}</button>`}</div></div>`;$('#protocol').value=protocol;$('#protocol').onchange=e=>{protocol=e.target.value;phase=0;error=false;completed=false;render()};return}
if(step===2){renderEditor();return}
$('#content').innerHTML=`<h2>保存型号</h2><div class="good"><strong>${escape(modelName)}</strong><br>${escape(modelId)} · ${protocolLabel()}<br>已模拟采集 ${placed.filter(k=>k.code).length} 个按键</div><p>保存内容：型号信息、按键布局、功能类型和逐键采集的键码。</p><div class="hint">“保存并使用”将型号配置保存到本机，并同步到接收器。此预览仅演示结果，不写入实际配置。</div><div id="saved" role="status"></div><div class="footer"><button onclick="go(2)">返回</button><div class="row"><button onclick="download('mock-adaptation.json',{mock:true,modelName,modelId,protocol,buttons:placed})">导出演示记录</button><button class="primary" onclick="installed()">保存并使用</button></div></div>`;
}
function selectDevice(i){selected=i?'遥控器':scenario==='unicom'?'联通遥控器':'小米遥控器（待确认型号）';modelName=selected;go(1)}
async function connect(){const t=++token;error=false;completed=false;for(let p=1;p<=4;p++){if(t!==token)return;phase=p;render();await new Promise(r=>setTimeout(r,650));if(t!==token)return;if(scenario==='disconnect'&&!retried&&p===3){retried=true;error=true;render();return}}completed=true;render()}
function review(){if(!placed.length||placed.some(k=>!k.code))return;if(!modelName.trim()||!modelId.trim()){alert('请填写型号名称和标识');return}go(3)}
function download(name,data){const u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function diagnostic(){download('mock-diagnostic.json',{mock:true,scenario,device:selected,protocol,error:error?'BLE_HS_ENOTCONN':null});}
function installed(){$('#saved').innerHTML='<div class="good">型号已保存（预览）。接下来在“添加遥控器”中配对，验证按键与语音。</div>';}

let placed=[], nextKey=1, drag=null, captureId=null, pressed=false, pendingCode=null;
const catalog=[['导航',['上','下','左','右','确认','返回','主页','菜单']],['设备与语音',['电源','语音','音量＋','音量－','静音','TV','信号源','频道＋','频道－']],['播放与快捷入口',['播放/暂停','快进','快退','Netflix','YouTube','设置']],['数字',['1','2','3','4','5','6','7','8','9','0']]];
const modal=$('#modal');
function renderEditor(){const scrollTop=$('.editor aside')?.scrollTop??0;const verified=placed.filter(k=>k.code).length;$('#content').innerHTML=`<div class="row between"><h2>按键与布局</h2><span class="count">已验证 ${verified} / ${placed.length}</span></div><div class="namefields"><label class="field">型号名称<input id="modelName" value="${escape(modelName)}"></label><label class="field">型号标识<input id="modelId" value="${escape(modelId)}"></label></div><div class="editor"><section><div class="row between"><strong>遥控器布局</strong><small>单击验证 · 双击空格新增</small></div><div class="layout-tip"><strong>将右侧常用按键拖入网格</strong><span>已有按键优先使用常用类型；特殊按键可双击空格添加。</span></div><div class="canvas" aria-label="遥控器布局">${Array.from({length:40},(_,i)=>{const k=placed.find(k=>k.cell===i);return `<div class="cell ${k?'':'empty'}" data-cell="${i}" ${!k?'tabindex="0" role="button" aria-label="空格 '+(i+1)+'"':''}>${k?`<button class="tile ${k.code?'verified':''}" draggable="true" data-id="${k.id}" title="${escape(k.name)}${k.code?' · '+k.code:''}">${escape(k.name)}${k.code?'<span class="tick">✓</span>':''}</button>`:''}</div>`}).join('')}</div><div id="editorNotice" class="notice" role="status"></div></section><aside><strong>常用按键</strong>${catalog.map(([title,items])=>`<h3>${title}</h3><div class="palette">${items.map(name=>`<button draggable="true" data-name="${name}" ${placed.some(k=>k.name===name)?'disabled':''}>${name}</button>`).join('')}</div>`).join('')}<div class="trash" id="trash">拖到这里移除</div></aside></div><div class="footer"><button onclick="go(1)">返回</button><div class="row"><small>${placed.length===0?'尚未放置按键':verified<placed.length?'还有 '+(placed.length-verified)+' 个按键待验证':'全部按键已验证'}</small><button class="primary" id="next" ${!placed.length||verified<placed.length?'disabled':''} onclick="review()">下一步</button></div></div>`;
$('#modelName').oninput=e=>modelName=e.target.value;$('#modelId').oninput=e=>modelId=e.target.value;
document.querySelectorAll('.palette button:not(:disabled)').forEach(b=>{b.ondragstart=e=>startDrag(e,{name:b.dataset.name});b.ondragend=endDrag});
document.querySelectorAll('.cell').forEach(c=>{const cell=Number(c.dataset.cell);c.ondragover=e=>{e.preventDefault();c.classList.add('over')};c.ondragleave=()=>c.classList.remove('over');c.ondrop=e=>{e.preventDefault();place(cell,drag);endDrag()};if(c.classList.contains('empty')){c.ondblclick=()=>custom(cell);c.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();custom(cell)}}}});
document.querySelectorAll('.tile').forEach(b=>{b.ondragstart=e=>startDrag(e,{id:Number(b.dataset.id)});b.ondragend=endDrag;b.onclick=()=>{capture(Number(b.dataset.id))}});
$('.editor aside').scrollTop=scrollTop;const trash=$('#trash');trash.ondragover=e=>{e.preventDefault();trash.classList.add('over')};trash.ondragleave=()=>trash.classList.remove('over');trash.ondrop=e=>{e.preventDefault();if(drag?.id)placed=placed.filter(k=>k.id!==drag.id);endDrag();render()};
}
function startDrag(e,value){drag=value;e.dataTransfer.setData('text/plain',JSON.stringify(value));e.dataTransfer.effectAllowed='move'}
function endDrag(){drag=null;document.querySelectorAll('.over').forEach(c=>c.classList.remove('over'))}
function place(cell,value){if(!value)return;const occupied=placed.find(k=>k.cell===cell);if(value.id){const k=placed.find(k=>k.id===value.id);if(!k)return;if(occupied)occupied.cell=k.cell;k.cell=cell}else{if(occupied){$('#editorNotice').textContent='这个位置已有按键';return}if(placed.some(k=>k.name===value.name))return;placed.push({id:nextKey++,name:value.name,type:value.type??(catalog.some(([,items])=>items.includes(value.name))?'standard':'custom'),cell,code:null})}render()}
function openDialog(html){modal.innerHTML=html;modal.showModal()}
function custom(cell){openDialog(`<h2 id="modalTitle">添加按键</h2><label class="field">按键类型<select id="keyType"><option value="">选择常用按键</option>${catalog.map(([group,items])=>`<optgroup label="${group}">${items.map(name=>`<option value="${name}" ${placed.some(k=>k.name===name)?'disabled':''}>${name}${placed.some(k=>k.name===name)?'（已添加）':''}</option>`).join('')}</optgroup>`).join('')}<option value="custom">自定义</option></select></label><label class="field" id="customField" hidden>名称<input id="customName" maxlength="24" placeholder="例如：Disney+"></label><p class="formerror" id="customError" role="alert"></p><div class="footer"><button onclick="modal.close()">取消</button><button class="primary" id="addCustom">添加</button></div>`);$('#keyType').onchange=()=>{$('#customField').hidden=$('#keyType').value!=='custom';$('#customError').textContent='';if(!$('#customField').hidden)$('#customName').focus()};$('#addCustom').onclick=()=>{const type=$('#keyType').value;const name=type==='custom'?$('#customName').value.trim():type;if(!name){$('#customError').textContent=type==='custom'?'请输入名称':'请选择按键类型';return}if(type==='custom'&&catalog.some(([,items])=>items.some(x=>x.toLowerCase()===name.toLowerCase()))){$('#customError').textContent='已有同名常用按键，请从按键类型中选择';return}if(placed.some(k=>k.name.toLowerCase()===name.toLowerCase())){$('#customError').textContent='这个按键已添加';return}modal.close();place(cell,{name,type:type==='custom'?'custom':'standard'})};$('#customName').onkeydown=e=>{if(e.key==='Enter')$('#addCustom').click()}}
function capture(id){stopVoice();captureId=id;pressed=false;pendingCode=null;const k=placed.find(k=>k.id===id);openDialog(`<h2 id="modalTitle">验证按键</h2><div class="capturebox"><span>${k.name==='语音'&&k.type==='standard'?'请按住语音键说话，再松开':'请在遥控器上按下并松开'}</span><strong>${escape(k.name)}</strong><p id="captureState" role="status">等待按键…</p><div class="codes">${k.code?'已记录：'+k.code:''}</div></div>${k.name==='语音'&&k.type==='standard'?voicePanel():''}<div class="sim"><small>模拟遥控器 · 无需真实设备</small><label class="field">模拟键码<input id="simCode" value="0x${(0x30+k.id).toString(16).toUpperCase()}"></label><div class="row"><button id="press" onclick="simPress()">模拟按下</button><button id="release" onclick="simRelease()" disabled>模拟松开</button></div></div><div class="footer"><button onclick="removeCaptured()">移除按键</button><button onclick="modal.close()">取消</button><button class="primary" id="confirmCapture" disabled onclick="confirmCapture()">确认</button></div>`)}
function simPress(){const code=$('#simCode').value.trim();if(!/^0x[0-9a-f]{1,4}$/i.test(code)){$('#captureState').textContent='请输入有效的十六进制键码';return}pendingCode='0x'+parseInt(code,16).toString(16).toUpperCase();pressed=true;$('#simCode').disabled=true;$('#press').disabled=true;$('#release').disabled=false;$('#confirmCapture').disabled=true;$('#captureState').textContent='已收到按下，等待松开…';if(isVoice())startVoice()}
function simRelease(){if(!pressed)return;pressed=false;if(isVoice())finishVoice();$('#release').disabled=true;const duplicate=placed.find(k=>k.id!==captureId&&k.code===pendingCode);if(duplicate){if(isVoice()){$('#listenVoice').disabled=true;$('#voiceOK').disabled=true;voiceReady=false;}$('#captureState').textContent='该键码已用于“'+duplicate.name+'”，请重新采集';$('#simCode').disabled=false;$('#press').disabled=false;pendingCode=null;return}$('#captureState').textContent='已收到按下和松开 · '+pendingCode;$('#confirmCapture').disabled=isVoice();$('#simCode').disabled=false;$('#press').disabled=false}
function confirmCapture(){if(!pendingCode||pressed||$('#confirmCapture').disabled)return;const k=placed.find(k=>k.id===captureId);if(k){k.code=pendingCode;if(isVoice())k.voiceVerified=true;}modal.close();render()}
function removeCaptured(){placed=placed.filter(k=>k.id!==captureId);modal.close();render()}

let voiceTimer=null,voiceStart=0,voiceReady=false,voiceListened=false,audioCtx=null,voiceRun=0;
function isVoice(){const k=placed.find(k=>k.id===captureId);return k?.name==='语音'&&k.type==='standard'}
function voicePanel(){return `<section class="voice-panel"><div class="row between"><strong>语音测试</strong><span id="voiceTime">0.0 秒</span></div><div class="voice-bars" id="voiceBars" aria-hidden="true">${Array.from({length:22},(_,i)=>`<i style="--h:${12+(i*17%39)}px;--delay:${i%5*.11}s"></i>`).join('')}</div><p id="voiceStatus" role="status">等待音频</p><div class="row"><button id="listenVoice" disabled onclick="listenVoice()">试听示例音</button><label><input id="voiceOK" type="checkbox" disabled onchange="$('#confirmCapture').disabled=!(this.checked&&voiceReady&&voiceListened&&!pressed&&pendingCode)"> 声音正常</label></div><label class="field">模拟音频结果<select id="voiceScenario"><option value="ok">正常收到并解码</option><option value="missing">未收到音频</option><option value="decode">解码失败</option></select></label><small>仅演示状态；试听播放提示音，不采集麦克风。</small></section>`}
function stopVoice(){voiceRun++;clearInterval(voiceTimer);voiceTimer=null;if(audioCtx){void audioCtx.close();audioCtx=null}}
modal.addEventListener('close',stopVoice);
function startVoice(){stopVoice();voiceReady=false;voiceListened=false;voiceStart=Date.now();$('#voiceOK').checked=false;$('#voiceOK').disabled=true;$('#listenVoice').disabled=true;$('#voiceScenario').disabled=true;const mode=$('#voiceScenario').value;$('#voiceBars').classList.toggle('recording',mode==='ok');$('#voiceStatus').textContent=mode==='ok'?'正在接收音频 · 解码正常':mode==='missing'?'等待语音数据…':'已收到音频 · 解码失败';$('#voiceTime').textContent='0.0 秒';voiceTimer=setInterval(()=>{$('#voiceTime').textContent=((Date.now()-voiceStart)/1000).toFixed(1)+' 秒'},100)}
function finishVoice(){clearInterval(voiceTimer);voiceTimer=null;$('#voiceBars').classList.remove('recording');$('#voiceScenario').disabled=false;const mode=$('#voiceScenario').value;voiceReady=mode==='ok';$('#voiceStatus').textContent=mode==='ok'?'录音结束 · 待试听':mode==='missing'?'没有收到语音数据，请重新测试':'音频解码失败，请保存诊断或重新测试';$('#listenVoice').disabled=!voiceReady;}
async function listenVoice(){if(!voiceReady||pressed)return;stopVoice();const run=voiceRun;try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();await audioCtx.resume();if(run!==voiceRun)return;const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),t=audioCtx.currentTime;osc.frequency.value=440;gain.gain.setValueAtTime(0,t);gain.gain.linearRampToValueAtTime(.06,t+.04);gain.gain.linearRampToValueAtTime(0,t+.65);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+.7);$('#listenVoice').disabled=true;$('#voiceStatus').textContent='正在播放示例音…';osc.onended=()=>{if(run!==voiceRun||!modal.open)return;voiceListened=true;$('#voiceStatus').textContent='试听结束';$('#voiceOK').disabled=false;$('#listenVoice').disabled=false;stopVoice()}}catch(e){$('#voiceStatus').textContent='无法播放示例音，请重试';$('#listenVoice').disabled=false;stopVoice()}}
render();
</script></html>
