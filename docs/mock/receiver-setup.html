<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>初始化接收器 · 交互预览</title>
<style>
:root{font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif;color:#36342e;background:#f4f1e9}*{box-sizing:border-box}body{margin:0}button,select,input{font:inherit}button,select{border:1px solid #ded8cd;border-radius:10px;padding:9px 15px;background:#fffdf8;color:inherit;cursor:pointer}button:disabled{opacity:.45;cursor:default}button:hover:not(:disabled){background:#eee6db}button.primary{background:#a9583c;border-color:#a9583c;color:white}button.danger{background:#ad443a;border-color:#ad443a;color:white}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #c58e6f;outline-offset:3px}.app{max-width:980px;margin:auto;padding:28px}.top,.row{display:flex;align-items:center;gap:12px}.top{justify-content:space-between;flex-wrap:wrap}.brand{border:0;background:transparent;padding:0;font-size:21px;font-weight:650}.brand span{display:inline-grid;place-items:center;background:#ac5a3e;color:#fff;border-radius:11px;width:32px;height:38px;margin-right:10px}.connection{font-size:13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.dot{width:7px;height:7px;background:#aaa398;border-radius:50%}.muted,small{color:#81796c}.muted{font-size:14px}h1{font-size:25px;margin:0 0 12px}h2{font-size:22px;margin:0 0 8px}h3{font-size:16px;margin:0}p{margin:8px 0 16px}.nav{display:flex;gap:8px;margin:26px 0}.nav button{border:0;background:transparent}.nav button.active{background:#e9dfd1;color:#8e4a33}.surface{background:#fffdf8;border:1px solid #e4ddd2;border-radius:20px;padding:28px}.empty{text-align:center;padding:54px 20px}.remote{font-size:36px;line-height:1;width:57px;height:88px;background:#e9e1d4;border-radius:22px;margin:0 auto 24px;display:grid;place-items:center;color:#9d6a51}.setting{display:flex;align-items:center;justify-content:space-between;gap:20px}.setting p{margin:5px 0 0}.preview{margin-top:28px;padding:16px 0;border-top:1px dashed #cfc5b6;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px}.preview select{max-width:100%;font-size:13px}.preview small{width:100%}dialog{border:1px solid #e2d9cb;border-radius:20px;background:#fffdf8;color:#36342e;padding:0;width:min(580px,calc(100vw - 28px));max-height:calc(100dvh - 32px);box-shadow:0 24px 100px #352a2633}dialog::backdrop{background:#302d285c}.dialog-head{padding:24px 28px 16px;display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid #eee7dd}.dialog-head strong{font-size:17px}.close{border:0;background:transparent;font-size:23px;padding:0 7px}.body{padding:24px 28px}.steps{display:flex;gap:16px;font-size:12px;margin-bottom:22px;color:#978c7d}.steps .active{color:#985137;font-weight:650}.steps .done{color:#617754}.footer{display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:18px 28px;border-top:1px solid #eee7dd;flex-wrap:wrap}.footer .back{margin-right:auto}.devices{display:grid;gap:10px;margin:20px 0}.device{display:flex;gap:13px;align-items:center;padding:15px;border:1px solid #ded6c8;border-radius:12px;cursor:pointer}.device:has(input:checked){border-color:#ac5a3e;background:#f7eee6}.device input{accent-color:#ac5a3e;width:17px;height:17px}.device strong,.device small{display:block}.device small{font-size:12px}.board{width:32px;height:45px;border:2px solid #8c9c86;border-radius:5px;background:#e8eddf;flex-shrink:0}.notice{background:#f2ece2;border-radius:10px;padding:14px 16px;font-size:14px;margin:16px 0}.warning{background:#faebe5;color:#8e4334}.success{background:#ecf1e8;color:#526649}.summary{margin:20px 0;border-top:1px solid #e9e1d7}.summary div{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid #e9e1d7;font-size:14px}.summary span{color:#807567}.summary strong{text-align:right;font-weight:500;overflow-wrap:anywhere}.agree{display:flex;gap:12px;align-items:flex-start;margin:20px 0 4px;font-size:14px}.agree input{width:18px;height:18px;margin:3px 0;flex-shrink:0;accent-color:#a9583c}details{margin:18px 0 0;font-size:13px;color:#81796c}details pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:12px;background:#f3eee5}.spinner{display:inline-block;vertical-align:middle;width:17px;height:17px;border:2px solid #ddd4c6;border-top-color:#ac5a3e;border-radius:50%;animation:spin 1s linear infinite;margin-right:8px}@keyframes spin{to{transform:rotate(360deg)}}.work{min-height:185px;display:grid;align-content:center;gap:12px}.work p{margin:0}.track{height:7px;border-radius:8px;background:#e8dfd3;overflow:hidden}.track i{display:block;height:100%;background:#ac5a3e;width:0;transition:width .3s}.tasks{list-style:none;padding:0;margin:18px 0}.tasks li{display:flex;gap:12px;align-items:center;padding:9px 0}.tasks .pending{color:#9f978c}.check{color:#667d57}.badge{display:inline-block;padding:3px 9px;border-radius:6px;background:#e8eee1;color:#60764f;font-size:12px}.manual{padding-left:22px}.manual li{margin:9px 0}.key{display:inline-block;border:1px solid #d2c6b6;border-bottom-width:3px;padding:1px 8px;border-radius:5px;font-size:12px}.result-symbol{font-size:30px;color:#6a8057;margin-bottom:8px}.error-symbol{color:#aa4d3c}[hidden]{display:none!important}@media(max-width:600px){.app{padding:18px}.top{align-items:flex-start}.brand{font-size:18px}.surface{padding:20px}.setting{align-items:flex-start;flex-direction:column}.dialog-head{padding:18px 20px}.body{padding:20px}.footer{padding:16px 20px}.steps{gap:10px;font-size:11px}.connection{width:100%}.empty{padding:38px 12px}.summary div{gap:8px}.preview{margin-top:20px}}@media(prefers-reduced-motion:reduce){.spinner{animation:none}.track i{transition:none}}
.preview{color:#70518f;background:#f0e8f8;border:1px dashed #c5afd9;border-radius:12px;padding:14px 16px}.preview small{color:#70518f}.preview select{color:#70518f;border-color:#c5afd9;background:#faf7fd}
</style>
<div class="app">
 <header class="top"><button class="brand" onclick="page('home')"><span>◉</span>Vibe Remote Buddy</button><div class="connection" id="connection"></div></header>
 <nav class="nav"><button id="homeTab" onclick="page('home')">遥控器</button><button id="settingsTab" onclick="page('settings')">设置</button></nav>
 <main id="main"></main>
 <aside class="preview"><strong>仅预览 · 不会出现在成品中</strong><label>场景 <select id="scenario" onchange="reset()"><option value="auto">自动连接 · 正常安装</option><option value="manual">需要按 BOOT</option><option value="multiple">插着两块开发板</option><option value="none">未发现设备</option><option value="incompatible">不兼容 · ESP32-C6</option><option value="unknown">硬件规格无法确认</option><option value="protected">设备启用了安全保护</option><option value="package">应用没有安装包</option><option value="changed">检查后设备被拔出</option><option value="failure">写入中断</option><option value="reboot">写入成功但未重新连接</option></select></label><small>设备与进度均为模拟，不会刷机。</small></aside>
</div>
<dialog id="wizard" aria-labelledby="dialogTitle"><div class="dialog-head"><strong id="dialogTitle">初始化接收器</strong><button class="close" aria-label="关闭" onclick="closeWizard()">×</button></div><div class="body" id="body"></div><div class="footer" id="footer"></div></dialog>
<script>
const $=s=>document.querySelector(s);let view='home',state='select',selected='',busy=false,installed=false,timers=[],manualReady=false,recovery=false;
const devices=[{id:'A',name:'USB JTAG/serial debug unit',port:'COM14',serial:'…7A31',mac:'34:85:18:2C:7A:31'},{id:'B',name:'Silicon Labs CP210x',port:'COM9',serial:'…92B4',mac:'48:CA:43:11:92:B4'}];
const mode=()=>$('#scenario').value;const device=()=>devices.find(x=>x.id===selected)||devices[0];
function later(fn,ms){timers.push(setTimeout(fn,ms))}function stop(){timers.forEach(clearTimeout);timers=[]}
function reset(){stop();installed=false;manualReady=false;recovery=false;busy=false;if($('#wizard').open)$('#wizard').close();page(view)}
function page(v){view=v;$('#homeTab').classList.toggle('active',v==='home');$('#settingsTab').classList.toggle('active',v==='settings');$('#connection').innerHTML=installed?'<span class="badge">接收器已连接</span>':'<span class="dot"></span><span>未找到接收器</span>'+(mode()!=='none'?'<button onclick="openWizard()">初始化接收器</button>':'');$('#main').innerHTML=v==='home'?`<h1>遥控器</h1><section class="surface empty"><div class="remote">·</div><h2>${installed?'接收器已就绪':'连接你的接收器'}</h2>${installed?'<p class="muted">还没有添加遥控器</p>':''}${installed?'<button class="primary" onclick="$(\'#main\').innerHTML=\'<section class=&quot;surface&quot;><h2>添加遥控器</h2><p class=&quot;muted&quot;>请将遥控器置于配对模式</p><span class=&quot;spinner&quot;></span>正在搜索…</section>\'">添加遥控器</button>':''}</section>`:`<h1>设置</h1><section class="surface"><h3>高级</h3><div class="setting" style="margin-top:22px"><div><strong>初始化接收器</strong><p class="muted">安装或恢复接收器固件</p></div><button onclick="openWizard()">打开</button></div></section>`}
function steps(n){return '<div class="steps">'+['1 选择设备','2 检查设备','3 确认安装','4 完成'].map((x,i)=>`<span class="${i===n?'active':i<n?'done':''}">${x}</span>`).join('')+'</div>'}
function buttons(html){$('#footer').innerHTML=html;$('.close').disabled=busy}
const cancel='<button class="back" onclick="closeWizard()">取消</button>';
function openWizard(){stop();selected='';manualReady=false;recovery=false;busy=false;$('#wizard').showModal();showSelect()}
function closeWizard(){if(busy)return;stop();$('#wizard').close()}
$('#wizard').addEventListener('cancel',e=>{if(busy)e.preventDefault();else stop()});
function showSelect(){stop();state='select';busy=false;const list=mode()==='none'?[]:mode()==='multiple'?devices:[devices[0]];$('#body').innerHTML=steps(0)+'<h2>选择设备</h2>'+(!list.length?'<div class="work"><p><span class="spinner"></span>等待设备连接</p><p class="muted">检查数据线，或按住 BOOT 重新插入 USB。</p></div>':'<div class="devices">'+list.map(d=>`<label class="device"><input type="radio" name="device" value="${d.id}" ${selected===d.id?'checked':''} onchange="selected=this.value;$(\'#inspect\').disabled=false"><span class="board" aria-hidden="true"></span><span><strong>${d.name}</strong><small>${d.port} · 序列号 ${d.serial}</small></span></label>`).join('')+'</div><div class="notice">检查将重启设备，不清除数据。</div>');buttons(cancel+`<button id="inspect" class="primary" ${selected?'':'disabled'} onclick="inspect()">检查设备</button>`)}
function inspect(){state='checking';busy=true;$('#body').innerHTML=steps(1)+'<h2>正在检查设备</h2><div class="work" role="status"><p><span class="spinner"></span>连接下载模式</p><p class="muted">'+device().port+' · 序列号 '+device().serial+'</p></div>';buttons('<button disabled>检查中…</button>');later(()=>{busy=false;if(mode()==='manual'&&!manualReady)return manual();if(['incompatible','unknown','protected','package'].includes(mode()))return blocked();confirmInstall()},1000)}
function manual(){state='manual';$('#body').innerHTML=steps(1)+'<h2>进入下载模式</h2><p class="muted">未能自动进入下载模式。</p><ol class="manual"><li>按住 <span class="key">BOOT</span>。</li><li>按一下 <span class="key">RESET / EN</span>。</li><li>松开 <span class="key">BOOT</span>。</li></ol><p class="muted">没有 RESET 按钮时，按住 BOOT 拔插 USB。</p>';buttons('<button class="back" onclick="showSelect()">返回</button><button class="primary" onclick="manualReady=true;inspect()">重新检查</button>')}
function blocked(){state='blocked';const data={incompatible:['这块开发板暂不支持','检测到 ESP32-C6。此安装包仅适用于 ESP32-S3。'],unknown:['无法确认硬件规格','已确认 ESP32-S3 和 16 MB Flash，但尚未确认 PSRAM 的容量和类型。'],protected:['无法安装到这台设备','检测到安全启动或 Flash 加密保护，当前安装包无法使用。'],package:['没有可用的安装包','当前应用未附带适用于这块开发板的完整安装包。']}[mode()];$('#body').innerHTML=steps(1)+`<h2>${data[0]}</h2><div class="notice warning" role="alert">${data[1]}</div><p class="muted">未清除原有数据。</p>`+(mode()==='unknown'?'<p class="muted">需要 16 MB Flash / 8 MB Octal PSRAM。请核对开发板型号。</p>':'')+'<details><summary>设备信息</summary><pre>'+device().port+' · '+device().serial+'\n检查阶段：硬件与安装包校验</pre></details>';buttons('<button class="back" onclick="showSelect()">重新选择</button><button onclick="closeWizard()">关闭</button>')}
function summary(){return `<div class="summary"><div><span>目标设备</span><strong>ESP32-S3 · ${device().port}</strong></div><div><span>设备标识</span><strong>${device().mac}</strong></div><div><span>硬件规格</span><strong>16 MB Flash / 8 MB Octal PSRAM</strong></div><div><span>即将安装</span><strong>Vibe Remote Buddy · 0.8.0</strong></div></div>`}
function confirmInstall(){state='confirm';busy=false;$('#body').innerHTML=steps(2)+`<h2>${recovery?'重新安装':'确认初始化'}</h2>`+summary()+'<div class="notice warning"><strong>将清除这块开发板的全部内容。</strong><br>原固件、设置及配对信息均会丢失。不备份，无法撤销。</div><label class="agree"><input id="consent" type="checkbox" onchange="$(\'#install\').disabled=!this.checked"><span>确认清除以上设备并安装</span></label>';buttons('<button class="back" onclick="showSelect()">返回</button><button id="install" class="danger" disabled onclick="install()">清除并安装</button>')}
function install(){if(!$('#consent')?.checked)return;if(mode()==='changed'){state='lost';$('#body').innerHTML=steps(2)+'<h2>设备已断开</h2><div class="notice warning" role="alert">安装未开始，未清除数据。</div><p class="muted">请重新连接并检查设备。</p>';buttons('<button class="back" onclick="closeWizard()">关闭</button><button class="primary" onclick="selected=\'\';showSelect()">重新选择设备</button>');return}state='writing';busy=true;renderProgress(0);let n=0;function tick(){n++;if(mode()==='failure'&&!recovery&&n===3){busy=false;state='failed';$('#body').innerHTML=steps(2)+'<h2>安装中断</h2><div class="notice warning" role="alert">USB 已断开，原程序可能已被清除。</div><p>请重新连接这块开发板。</p><p class="muted">若没有出现端口，按住 BOOT 拔插 USB。</p><details><summary>错误详情</summary><pre>设备：'+device().mac+'\n阶段：写入应用\n错误：串口连接中断</pre></details>';buttons('<button class="back" onclick="closeWizard()">关闭</button><button class="primary" onclick="recovery=true;inspect()">重新检查设备</button>');return}if(n<=4){renderProgress(n);later(tick,750)}else finish()}later(tick,750)}
function renderProgress(n){const titles=['正在清除原有内容','正在写入接收器程序','正在校验写入内容','正在重启设备','正在等待接收器'];$('#body').innerHTML=steps(n>=3?3:2)+'<h2>'+titles[n]+'</h2><p class="muted">'+device().port+' · '+device().mac+'</p><div class="work"><div class="track" role="progressbar" aria-label="安装进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+[5,35,70,85,95][n]+'"><i style="width:'+[5,35,70,85,95][n]+'%"></i></div><ul class="tasks">'+['清除并写入','校验固件','重启并确认连接'].map((x,i)=>'<li class="'+(i>Math.floor(n/2)?'pending':'')+'"><span class="check">'+(i<Math.floor(n/2)?'✓':i===Math.floor(n/2)?'●':'○')+'</span>'+x+'</li>').join('')+'</ul><p class="muted">请勿拔出设备或退出应用。</p></div>';buttons('<button disabled>安装中…</button>')}
function finish(){busy=false;if(mode()==='reboot'&&!recovery){state='waiting';$('#body').innerHTML=steps(3)+'<h2>固件已写入，等待接收器上线</h2><div class="notice">写入校验通过，接收器尚未连接。</div><p>松开 BOOT，按 RESET 或重新插入 USB。</p><p class="muted">双 USB 接口的开发板，请连接原生 USB 接口。</p>';buttons('<button class="back" onclick="closeWizard()">稍后检查</button><button class="primary" onclick="recovery=true;busy=true;renderProgress(4);later(finish,900)">重新检测</button>');return}state='done';installed=true;$('#body').innerHTML=steps(3)+'<div class="result-symbol">✓</div><h2>接收器已就绪</h2><p class="muted">固件 0.8.0</p>';buttons('<button class="primary" onclick="closeWizard();page(\'home\')">完成</button>');page(view)}
page('home');
</script>
</html>
