[package]
name = "vibe-remote-buddy"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
open = "5"
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility", "Win32_UI_TextServices", "Win32_UI_HiDpi", "Win32_UI_Input_Ime", "Win32_System_Threading", "Win32_System_Com", "Win32_System_Variant", "Win32_System_Ole", "Win32_Graphics_Dwm"] }
