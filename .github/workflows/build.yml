name: Windows build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "App version (blank uses package.json)"
        type: string
        required: false
      publish:
    needs: build
    if: github.repository == 'kxn/vibe-remote-buddy-app' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish))
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/publish.yml
    with:
      run_id: ${{ github.run_id }}
